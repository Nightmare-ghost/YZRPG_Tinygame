<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7fd7ff">
  <title>棋子 / 斗士名称数据库 · 同人小游戏合集</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5f9e'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38' fill='%23fff6e6'%3E%E5%90%8D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/names.css">
  <link rel="stylesheet" href="css/arena.css">
</head>
<body class="names-page">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="回到游戏">
      <span class="brand-seal">名</span>
      <span class="brand-text">
        <strong>名册编辑</strong>
        <small>NAME DATABASE</small>
      </span>
    </a>
    <div class="top-actions">
      <a class="top-link" href="index.html">← 返回游戏</a>
    </div>
  </header>

  <main class="names-wrap">
    <div class="names-head">
      <div class="names-title">
        <p class="eyebrow"><span class="eyebrow-line"></span>PIECE / CHARACTER NAME DATABASE</p>
        <h1>棋子 / 斗士名称数据库</h1>
        <p class="names-sub">五个区域分开管理：名字、竞技场参数与永久分发数据。改完先保存，竞技场参数再点「导出默认值」覆盖 js/default-names.js。</p>
      </div>
      <div class="names-actions">
        <button class="btn primary" id="names-save">保存修改</button>
        <button class="btn" id="names-export">导出 JSON</button>
        <button class="btn" id="names-export-defaults">导出默认值</button>
        <button class="btn" id="names-import-btn">导入 JSON</button>
        <button class="btn ghost danger" id="names-reset">恢复默认</button>
      </div>
    </div>

    <div class="names-summary" id="names-summary"></div>
    <div class="names-tabs" id="names-tabs" role="tablist"></div>
    <div class="names-panel-wrap" id="names-panel-wrap"></div>

    <footer class="names-footer">
      <span id="names-status">尚未修改</span>
      <span>提示：名称改完保存即可；竞技场参数要「导出默认值」替换 js/default-names.js，才会永久进入分发包。</span>
    </footer>
  </main>

  <input type="file" id="names-import-file" accept=".json,application/json" hidden>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/guess-data.js"></script>
  <script src="js/default-names.js"></script>
  <script src="js/piece-db.js"></script>
  <script src="js/names-app.js"></script>
</body>
</html>
